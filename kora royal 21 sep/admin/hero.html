  <!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hero Slides — KORA ROYAL Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><script src="admin-core.js"></script><link rel="stylesheet" href="hero.css"></head><body><div class="kr-admin-layout"><aside id="krAdminSidebar"></aside><div class="kr-sidebar-overlay" id="krSidebarOverlay"></div><div class="kr-admin-right"><header class="kr-admin-topbar"><button class="kr-mobile-menu-btn" id="krMobileMenuBtn"></button><div class="kr-topbar-title">Hero Slides</div><button class="kr-btn kr-btn-ghost kr-btn-sm" id="heroRefresh">Refresh</button><button class="kr-btn kr-btn-primary kr-btn-sm" id="heroAdd">+ Add Slide</button></header><main class="kr-admin-main"><div class="kr-hero-admin-note">Hero slides are independent from products. <b>Order Now</b> always opens the product-selection form; <b>Collections</b> always opens the product cards.</div><div id="heroList" class="kr-hero-admin-list"><div class="kr-empty">Loading slides…</div></div></main></div></div><div id="heroModal" class="kr-modal-backdrop"><section class="kr-modal-box kr-hero-editor" role="dialog" aria-modal="true"><div class="kr-hero-editor-head"><div><h2 id="heroEditorTitle">Add Hero Slide</h2><p>Blank text fields remain visually blank.</p></div><button type="button" class="kr-hero-editor-x" data-hero-close>×</button></div><div class="kr-hero-editor-body"><input id="heroId" type="hidden"><div class="kr-hero-form-grid"><label>Internal name<input id="heroName" class="kr-input" placeholder="Only visible in Admin"></label><label>Priority<input id="heroPriority" class="kr-input" type="number" value="100"></label></div><label>Cloudinary hero image URL<input id="heroImage" class="kr-input" type="url" data-kr-upload="hero" placeholder="https://res.cloudinary.com/... or click Upload / drop an image"></label><div class="kr-hero-preview" id="heroPreview"><span>Image preview</span></div><h3>English lines</h3><div class="kr-hero-form-grid kr-hero-form-grid--3"><label>Line 1<input id="heroL1En" class="kr-input"></label><label>Line 2 (accent)<input id="heroL2En" class="kr-input"></label><label>Line 3<input id="heroL3En" class="kr-input"></label></div><h3>Bangla lines</h3><div class="kr-hero-form-grid kr-hero-form-grid--3"><label>Line 1<input id="heroL1Bn" class="kr-input"></label><label>Line 2 (accent)<input id="heroL2Bn" class="kr-input"></label><label>Line 3<input id="heroL3Bn" class="kr-input"></label></div><label>Status<select id="heroStatus" class="kr-input"><option value="active">Active</option><option value="archived">Archived</option></select></label></div><div class="kr-hero-editor-foot"><button type="button" class="kr-btn kr-btn-ghost" data-hero-close>Cancel</button><button type="button" class="kr-btn kr-btn-primary" id="heroSave">Save Slide</button></div></section></div><script src="admin-hero.js"></script></body></html>
