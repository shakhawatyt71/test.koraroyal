<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Customers CRM — KORA ROYAL</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><script src="admin-core.js"></script><link rel="stylesheet" href="customers.css"></head><body><div class="kr-admin-layout"><aside id="krAdminSidebar"></aside><div id="krSidebarOverlay" class="kr-sidebar-overlay"></div><div class="kr-admin-right"><header class="kr-admin-topbar"><button id="krMobileMenuBtn" class="kr-mobile-menu-btn"></button><div class="kr-topbar-title">Customers & Leads</div><button id="crmImport" class="kr-btn kr-btn-ghost kr-btn-sm">Sync Legacy KV</button><button id="crmRefresh" class="kr-btn kr-btn-ghost kr-btn-sm">Refresh</button></header><main class="kr-admin-main"><div id="crmStats" class="kr-crm-stats"></div><div class="kr-crm-tabs"><button class="is-active" data-crm-tab="customers">Ordered Customers</button><button data-crm-tab="leads">Non-order Leads</button></div><div class="kr-crm-filters"><input id="crmSearch" class="kr-input" placeholder="Name, phone, email, district…"><input id="crmDistrict" class="kr-input" placeholder="District"><input id="crmFrom" class="kr-input" type="date"><input id="crmTo" class="kr-input" type="date"><select id="crmSort" class="kr-input"><option value="delivered_spend_desc">Highest delivered spend</option><option value="orders_desc">Most orders</option><option value="recent_desc">Most recent</option><option value="returns_desc">Most returns</option><option value="name_asc">Name A–Z</option><option value="district_asc">District</option></select></div><div id="crmList" class="kr-crm-list"><div class="kr-empty">Loading…</div></div><div id="crmPages" class="kr-pages"></div></main></div></div><div id="crmModal" class="kr-modal-backdrop"><section clas
