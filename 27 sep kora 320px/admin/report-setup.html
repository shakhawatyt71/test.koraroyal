<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bug Report Setup — KORA ROYAL Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #F2EFE9;
      color: #121313;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .setup-card {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .setup-icon {
      width: 64px;
      height: 64px;
      background: rgba(255,96,68,0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .setup-icon svg { width: 32px; height: 32px; color: #FF6044; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #717777; margin-bottom: 32px; line-height: 1.5; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 700; color: #3A3D3D; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #E0D9CF;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #FF6044; }
    .btn {
      width: 100%;
      padding: 16px;
      background: #FF6044;
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .btn:hover { background: #E8502E; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn svg { width: 20px; height: 20px; }
    .log {
      margin-top: 20px;
      padding: 16px;
      background: #F2EFE9;
      border-radius: 12px;
      font-size: 13px;
      font-family: monospace;
      line-height: 1.8;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    .log.show { display: block; }
    .log .ok { color: #23b26d; }
    .log .err { color: #ef4444; }
    .log .info { color: #717777; }
    .success-msg {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: rgba(35,178,109,0.1);
      border: 1px solid rgba(35,178,109,0.3);
      border-radius: 12px;
      color: #23b26d;
      font-weight: 600;
      text-align: center;
    }
    .success-msg.show { display: block; }
    .step-list {
      margin: 20px 0;
      padding: 0;
      list-style: none;
    }
    .step-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      font-size: 14px;
      color: #3A3D3D;
    }
    .step-num {
      width: 28px;
      height: 28px;
      background: #FF6044;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="setup-card">
    <div class="setup-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
    </div>
    <h1>Bug Report Setup</h1>
    <p class="subtitle">This will create the bug_reports table in your D1 database and add default categories.</p>

    <ul class="step-list">
      <li><span class="step-num">1</span> Enter your admin password below</li>
      <li><span class="step-num">2</span> Click "Setup Database"</li>
      <li><span class="step-num">3</span> Done! Tables created automatically</li>
    </ul>

    <div class="form-group">
      <label>Admin Password</label>
      <input type="password" id="adminPassword" placeholder="Enter your admin secret" />
    </div>

    <div class="form-group">
      <label>Worker URL</label>
      <input type="text" id="workerUrl" placeholder="https://your-worker.workers.dev" />
    </div>

    <button class="btn" id="setupBtn" onclick="runSetup()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Setup Database
    </button>

    <div class="log" id="log"></div>
    <div class="success-msg" id="successMsg">Setup completed successfully! You can now close this page.</div>
  </div>

  <script>
    function log(msg, type = 'info') {
      const el = document.getElementById('log');
      el.classList.add('show');
      const line = document.createElement('div');
      line.className = type;
      line.textContent = msg;
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    }

    async function runSetup() {
      const password = document.getElementById('adminPassword').value.trim();
      const workerUrl = document.getElementById('workerUrl').value.trim().replace(/\/+$/, '');

      if (!password) { alert('Please enter your admin password'); return; }
      if (!workerUrl) { alert('Please enter your Worker URL'); return; }

      const btn = document.getElementById('setupBtn');
      btn.disabled = true;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation:spin 1s linear infinite;"><path d="M21 12a9 9 0 11-6.219-8.56"/></svg> Setting up...';

      document.getElementById('log').innerHTML = '';
      document.getElementById('successMsg').classList.remove('show');

      try {
        // Step 1: Login to get token
        log('Step 1: Logging in...');
        const loginResp = await fetch(workerUrl + '/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password })
        });

        if (!loginResp.ok) {
          log('Login failed: ' + loginResp.status, 'err');
          throw new Error('Login failed');
        }

        const loginData = await loginResp.json();
        const token = loginData.token;
        if (!token) {
          log('No token received', 'err');
          throw new Error('No token');
        }
        log('Login successful!', 'ok');

        // Step 2: Run migration
        log('Step 2: Creating bug_reports table...');
        const migrateResp = await fetch(workerUrl + '/api/admin/bug-reports/migrate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          }
        });

        if (!migrateResp.ok) {
          log('Migration failed: ' + migrateResp.status, 'err');
          throw new Error('Migration failed');
        }

        const migrateData = await migrateResp.json();
        log('Tables created: ' + migrateData.executed + '/' + migrateData.total, 'ok');

        // Step 3: Verify
        log('Step 3: Verifying...');
        const verifyResp = await fetch(workerUrl + '/api/admin/bug-reports/categories', {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (verifyResp.ok) {
          const verifyData = await verifyResp.json();
          log('Categories loaded: ' + (verifyData.categories || []).length, 'ok');
        }

        log('', 'info');
        log('All done! Bug report system is ready.', 'ok');
        document.getElementById('successMsg').classList.add('show');

      } catch (e) {
        log('Error: ' + e.message, 'err');
      }

      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Setup Database';
    }
  </script>
</body>
</html>
