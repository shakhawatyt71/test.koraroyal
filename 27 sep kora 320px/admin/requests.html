<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Service Requests — KORA ROYAL</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"><script src="admin-core.js"></script><link rel="stylesheet" href="requests.css"></head><body><div class="kr-admin-layout"><aside id="krAdminSidebar"></aside><div id="krSidebarOverlay" class="kr-sidebar-overlay"></div><div class="kr-admin-right"><header class="kr-admin-topbar"><button id="krMobileMenuBtn" class="kr-mobile-menu-btn"></button><div class="kr-topbar-title">Return / Refund / Exchange Requests</div><button id="reqRefresh" class="kr-btn kr-btn-ghost kr-btn-sm">Refresh</button></header><main class="kr-admin-main"><div class="kr-req-filters"><select id="reqStatus" class="kr-input"><option value="all">All statuses</option><option value="requested">Requested</option><option value="reviewing">Reviewing</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="received">Received</option><option value="completed">Completed</option></select><select id="reqType" class="kr-input"><option value="all">All types</option><option value="return">Return</option><option value="refund">Refund</option><option value="exchange">Exchange</option></select></div><div id="reqList" class="kr-req-list"><div class="kr-empty">Loading…</div></div><div id="reqPages" class="kr-pages"></div></main></div></div><div id="reqModal" class="kr-modal-backdrop"><section class="kr-modal-box kr-req-modal"><header><h2>Review Request</h2><button data-req-close>×</button></header><div id="reqDetail" class="kr-req-detail"></div><div class="kr-req-form"><label>New status<select id="reqNewStatus" class="kr-input"><option value="reviewing">Reviewing</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="received">Returned Item Received</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><label>Internal/customer note<textarea id="reqAdminNote" class="kr-input" rows="3"></textarea></label><div id="reqResolution"><label class="kr-check"><input id="reqRestoreStock" type="checkbox"> Restore selected items to sellable stock after inspection</label><label class="kr-check"><input id="reqReverseSold" type="checkbox"> Reverse sold count for selected quantities</label><label>Refund/financial adjustment amount<input id="reqRefundAmount" type="number" min="0" class="kr-input" value="0"></label><label>Replacement order ID (exchange, optional)<input id="reqReplacement" class="kr-input"></label></div></div><footer><button class="kr-btn kr-btn-ghost" data-req-close>Close</button><button id="reqSave" class="kr-btn kr-btn-primary">Save Decision</button></footer></section></div><script src="admin-requests.js"></script></body></html>
